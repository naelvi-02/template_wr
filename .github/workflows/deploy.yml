name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        NEXTAUTH_URL: https://wr.naelvi.com
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        key: ${{ secrets.VPS_KEY }}
        port: ${{ secrets.VPS_PORT }}
        command_timeout: 20m
        envs: ADMIN_USERNAME,ADMIN_PASSWORD,NEXTAUTH_SECRET,NEXTAUTH_URL
        script: |
          set -e
          if [ ! -d "$HOME/template_wr" ]; then
            git clone https://github.com/naelvi-02/template_wr.git "$HOME/template_wr"
          fi
          cd "$HOME/template_wr"
          git fetch origin
          git reset --hard origin/main
          if ! command -v pm2 &> /dev/null; then
            npm install -g pm2
          fi
          
          # Setup environment (handle ! and special chars safely)
          if [ -z "$NEXTAUTH_SECRET" ]; then
            NEXTAUTH_SECRET=$(openssl rand -base64 32)
            echo "WARN: NEXTAUTH_SECRET was empty, generated ephemeral one"
          fi
          printf 'ADMIN_USERNAME=%s\nADMIN_PASSWORD=%s\nDATABASE_URL="file:./dev.db"\nNEXTAUTH_URL=%s\nNEXTAUTH_SECRET=%s\n' "$ADMIN_USERNAME" "$ADMIN_PASSWORD" "$NEXTAUTH_URL" "$NEXTAUTH_SECRET" > .env

          rm -rf node_modules
          npm install
          
          # Setup database
          npx prisma generate
          npx prisma db push --accept-data-loss
          npx tsx prisma/seed.ts
          
          rm -rf .next
          npm run build
          pm2 restart wr-template-app || pm2 start npm --name "wr-template-app" -- start
